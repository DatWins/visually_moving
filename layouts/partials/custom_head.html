<style>
/* Visually Moving — Claude warm palette (terracotta / golden ivory) */
:root {
    --cover-text-color:#FDF5E6;
    --cover-title-and-description-guard-bg-color: rgba(26,21,32,.7);
    --cover-title-text-shadow: none;

    --highlight:#FDF5E6;
    --highlight-contrast:#1A1520;
    --highlight-inverse:#D97757;
    --highlight-inverse-contrast:#FFF8F0;

    --sticky-menu-text-color:#E8A98A;

    --section-light-bg-color:#F8EED8;
    --section-light-text-color:#1A1520;
    --section-dark-bg-color:#1A1520!important;
    --section-dark-text-color:#FDF5E6!important;
    --section-uni-quote:#D97757;
    --section-uni-code-bg-color:#EDE0C8;

    --footer-color-background:#0F0C14;
    --footer-color:#E8A98A;

    --ul-li-icon: ;
}
.blog-title, .blog-description { color:#FDF5E6 !important; }
.title-and-description-guard { border:1px solid rgba(217,119,87,.45); }
#site-head .btn.site-menu { border:none; font-weight:800; font-size:1.5em; color:#0A0710 !important; text-shadow: 0 1px 3px rgba(250,240,230,.5); }
.post-content a { text-decoration-color:#D97757; text-underline-offset:3px; }
.post-content a:hover { color:#B85C3A; }
.post-holder.dark .post-content a:hover { color:#E8A98A; }
.fixed-nav a.fn-item.active { color:#D97757; }
.post-content h2 { font-size: 1.9em; margin-top: 1.6em; scroll-margin-top: 72px; }
.post-title { margin-bottom: 0.4em; }

/* sub menu: categories within a group */
.submenu { display:flex; flex-wrap:wrap; gap:8px; margin:1.1em 0 1.6em; }
.submenu .sub-item { display:inline-block; padding:7px 14px; border-radius:999px; font-size:.82em; line-height:1.3;
  text-decoration:none !important; border:1.5px solid #1A1520; }
.submenu .ready { background:#1A1520; color:#FDF5E6 !important; }
.submenu .ready:hover, .submenu .ready:focus-visible { background:#D97757; border-color:#D97757; color:#fff !important; }
.submenu .ready:focus-visible { outline:3px solid #D97757; outline-offset:2px; }
.submenu .soon { color:#1A1520; opacity:.5; border-style:dashed; cursor:default; }
.post-holder.dark .submenu .sub-item { border-color:#FAF0E6; }
.post-holder.dark .submenu .ready { background:#FDF5E6; color:#1A1520 !important; }
.post-holder.dark .submenu .soon { color:#FDF5E6; }

#site-head .btn.site-menu, .fixed-nav a.fn-item { text-transform:none !important; letter-spacing:.02em; }
#site-head .btn.site-menu { font-size:1.5em; font-weight:800; }

@media only screen and (max-width: 1130px) {
  .fixed-nav {
    flex-wrap: nowrap !important; justify-content: flex-start; align-items: center; gap: 6px;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    padding: 8px 10px !important; background: #1A1520 !important; box-shadow: 0 2px 8px rgba(0,0,0,.25);
    box-sizing: border-box;
  }
  .fixed-nav::-webkit-scrollbar { display: none; }
  a.fn-item {
    display: inline-block !important; flex: 0 0 auto; margin: 0 !important;
    padding: 9px 14px; border-radius: 999px; white-space: nowrap;
    font-size: 15px; line-height: 1.2; letter-spacing: .02em;
    color: #FDF5E6 !important; background: rgba(253,245,230,.12); opacity: .9;
  }
  a.fn-item.active { background: #FDF5E6; color: #1A1520 !important; opacity: 1; }
  .post-holder .post { scroll-margin-top: 64px; }
  #site-head .btn.site-menu { padding: 10px 16px; margin: 5px 3px; font-size: 15px; }
  #site-head .blog-title { font-size: 3.4rem; }
  #site-head .blog-description { font-size: 1.9rem; }
  .submenu { gap:7px; }
  .submenu .sub-item { padding:8px 13px; font-size:14px; }
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var nav = document.querySelector('.fixed-nav'); if (!nav) return; var last = null;
  window.addEventListener('scroll', function () {
    var a = nav.querySelector('.fn-item.active'); if (!a || a === last || nav.scrollWidth <= nav.clientWidth) return; last = a;
    nav.scrollTo({ left: a.offsetLeft - (nav.clientWidth - a.offsetWidth) / 2, behavior: 'smooth' });
  }, { passive: true });
});
</script>
